      <text x="22" y="54" fill="#64748b" font-size="9.5" font-weight="600" letter-spacing="1.4">FRAMEWORKS · VECTOR DATA</text>

      <g transform="translate(20 76)"><rect width="120" height="38" rx="10" fill="#11182b" stroke="#a78bfa" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#22d3ee"/><text x="30" y="24" fill="#cbd5e1" font-size="13">LangChain</text></g>
      <g transform="translate(152 76)"><rect width="124" height="38" rx="10" fill="#11182b" stroke="#a78bfa" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#a78bfa"/><text x="30" y="24" fill="#cbd5e1" font-size="13">LangGraph</text></g>
      <g transform="translate(20 122)"><rect width="120" height="38" rx="10" fill="#11182b" stroke="#a78bfa" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#facc15"/><text x="30" y="24" fill="#cbd5e1" font-size="13">CrewAI</text></g>
      <g transform="translate(152 122)"><rect width="124" height="38" rx="10" fill="#11182b" stroke="#a78bfa" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#ec4899"/><text x="30" y="24" fill="#cbd5e1" font-size="13">AgentScope</text></g>
      <g transform="translate(20 168)"><rect width="120" height="38" rx="10" fill="#11182b" stroke="#a78bfa" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#60a5fa"/><text x="30" y="24" fill="#cbd5e1" font-size="13">ChromaDB</text></g>
      <g transform="translate(152 168)"><rect width="124" height="38" rx="10" fill="#11182b" stroke="#a78bfa" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#22c55e"/><text x="30" y="24" fill="#cbd5e1" font-size="13">Neo4j</text></g>
      <g transform="translate(20 214)"><rect width="120" height="38" rx="10" fill="#11182b" stroke="#a78bfa" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#ef4444"/><text x="30" y="24" fill="#cbd5e1" font-size="13">Qdrant</text></g>
      <g transform="translate(152 214)"><rect width="124" height="38" rx="10" fill="#11182b" stroke="#a78bfa" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#34d399"/><text x="30" y="24" fill="#cbd5e1" font-size="12">Agentic RL</text></g>
    </g>

    <g transform="translate(672 82)">
      <rect width="296" height="280" rx="18" fill="#0b1220" fill-opacity="0.92" stroke="#34d399" stroke-opacity="0.32" />
      <rect width="4" height="280" rx="2" fill="url(#green)" />
      <circle cx="268" cy="28" r="5" fill="#34d399" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite" />
      </circle>
      <text x="22" y="34" fill="#d1fae5" font-size="16" font-weight="700">Full-Stack Development</text>
      <text x="22" y="54" fill="#64748b" font-size="9.5" font-weight="600" letter-spacing="1.2">BACKEND · FRONTEND · DATA</text>

      <g transform="translate(20 76)"><rect width="120" height="38" rx="10" fill="#0e1c24" stroke="#34d399" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#f97316"/><text x="30" y="24" fill="#cbd5e1" font-size="13">Java</text></g>
      <g transform="translate(152 76)"><rect width="124" height="38" rx="10" fill="#0e1c24" stroke="#34d399" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#22c55e"/><text x="30" y="24" fill="#cbd5e1" font-size="12">Spring Boot</text></g>
      <g transform="translate(20 122)"><rect width="120" height="38" rx="10" fill="#0e1c24" stroke="#34d399" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#60a5fa"/><text x="30" y="24" fill="#cbd5e1" font-size="13">TypeScript</text></g>
      <g transform="translate(152 122)"><rect width="124" height="38" rx="10" fill="#0e1c24" stroke="#34d399" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#34d399"/><text x="30" y="24" fill="#cbd5e1" font-size="13">Vue</text></g>
      <g transform="translate(20 168)"><rect width="120" height="38" rx="10" fill="#0e1c24" stroke="#34d399" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#38bdf8"/><text x="30" y="24" fill="#cbd5e1" font-size="12">PostgreSQL</text></g>
      <g transform="translate(152 168)"><rect width="124" height="38" rx="10" fill="#0e1c24" stroke="#34d399" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#facc15"/><text x="30" y="24" fill="#cbd5e1" font-size="13">MySQL</text></g>
      <g transform="translate(20 214)"><rect width="120" height="38" rx="10" fill="#0e1c24" stroke="#34d399" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#ef4444"/><text x="30" y="24" fill="#cbd5e1" font-size="13">Redis</text></g>
      <g transform="translate(152 214)"><rect width="124" height="38" rx="10" fill="#0e1c24" stroke="#34d399" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#38bdf8"/><text x="30" y="24" fill="#cbd5e1" font-size="13">Docker</text></g>
    </g>
