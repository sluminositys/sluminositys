      <rect width="4" height="280" rx="2" fill="url(#cyan)" />
      <circle cx="268" cy="28" r="5" fill="#22d3ee" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="22" y="34" fill="#e0f2fe" font-size="16" font-weight="700">Model Training</text>
      <text x="22" y="54" fill="#64748b" font-size="9.5" font-weight="600" letter-spacing="1.3">DEEP LEARNING · DISTRIBUTED</text>

      <g transform="translate(20 76)"><rect width="120" height="38" rx="10" fill="#111c2e" stroke="#22d3ee" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#22d3ee"/><text x="30" y="24" fill="#cbd5e1" font-size="13">Python</text></g>
      <g transform="translate(152 76)"><rect width="124" height="38" rx="10" fill="#111c2e" stroke="#22d3ee" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#f97316"/><text x="30" y="24" fill="#cbd5e1" font-size="13">PyTorch</text></g>
      <g transform="translate(20 122)"><rect width="120" height="38" rx="10" fill="#111c2e" stroke="#22d3ee" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#facc15"/><text x="30" y="24" fill="#cbd5e1" font-size="13">Lightning</text></g>
      <g transform="translate(152 122)"><rect width="124" height="38" rx="10" fill="#111c2e" stroke="#22d3ee" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#a78bfa"/><text x="30" y="24" fill="#cbd5e1" font-size="12">Transformers</text></g>
      <g transform="translate(20 168)"><rect width="120" height="38" rx="10" fill="#111c2e" stroke="#22d3ee" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#60a5fa"/><text x="30" y="24" fill="#cbd5e1" font-size="12">MLP / CNN</text></g>
      <g transform="translate(152 168)"><rect width="124" height="38" rx="10" fill="#111c2e" stroke="#22d3ee" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#38bdf8"/><text x="30" y="24" fill="#cbd5e1" font-size="12">RNN / LSTM</text></g>
      <g transform="translate(20 214)"><rect width="120" height="38" rx="10" fill="#111c2e" stroke="#22d3ee" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#ec4899"/><text x="30" y="24" fill="#cbd5e1" font-size="11.5">BERT / Diffusion</text></g>
      <g transform="translate(152 214)"><rect width="124" height="38" rx="10" fill="#111c2e" stroke="#22d3ee" stroke-opacity="0.25"/><circle cx="17" cy="19" r="4" fill="#34d399"/><text x="30" y="24" fill="#cbd5e1" font-size="12">Multi-GPU DDP</text></g>
    </g>

    <g transform="translate(352 82)">
