      <rect width="4" height="280" rx="2" fill="url(#violet)" />
      <circle cx="268" cy="28" r="5" fill="#a78bfa" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite" />
