<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title>
  <desc id="desc">Model training, agent development, and full-stack development technologies</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="0.52" stop-color="#0f172a" />
      <stop offset="1" stop-color="#0c1f35" />
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="aurora">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.16" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity="0.035" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="388" rx="24" fill="url(#background)" stroke="#334155" />
  <rect x="1" y="1" width="998" height="388" rx="24" fill="url(#grid)" />
  <ellipse cx="180" cy="72" rx="260" ry="160" fill="url(#aurora)">
    <animate attributeName="cx" values="180;420;180" dur="16s" repeatCount="indefinite" />
  </ellipse>

  <g opacity="0.42" fill="none" stroke-width="1">
    <path d="M110 45L205 25L302 54L406 30L504 54L608 26L710 50L811 24L902 48" stroke="#38bdf8" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="8s" repeatCount="indefinite" />
    </path>
    <g fill="#e0f2fe" stroke="none" filter="url(#glow)">
      <circle cx="110" cy="45" r="2.5" /><circle cx="302" cy="54" r="2.5" />
      <circle cx="504" cy="54" r="2.5" /><circle cx="710" cy="50" r="2.5" />
      <circle cx="902" cy="48" r="2.5" />
    </g>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="36" y="49" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="3">TECH STACK</text>
    <text x="964" y="48" text-anchor="end" fill="#64748b" font-size="11" letter-spacing="1.5">TOOLS I BUILD WITH</text>

